[do_cs]
type: logical
doc: If true, a CS calculation will be performed
default: false
interface: ezfio,provider,ocaml

[theta_cs]
type: double precision
doc: Initial CS rotation.
default: -1.0
interface: ezfio,provider,ocaml

[theta_step_size]
type: double precision
doc: Step size when screening a range of CS rotation.
default: -1.0
interface: ezfio,provider,ocaml

[n_steps_cs]
type: integer
doc: Number of steps when screening a range of CS rotation.
default: 1
interface: ezfio,provider,ocaml

[cs_cipsi_per_theta]
type: logical
doc: If true, run a COMPLETE CS-CIPSI for each theta value successively (inverted loop) instead of selecting determinants at the base theta and only re-diagonalizing the other theta values on a fixed determinant set.
default: false
interface: ezfio,provider,ocaml

[do_qr_dav]
type: logical
doc: If true, qr orthogonalization of guess vectors will be performed at each iteration in the complex Davidson diagonalization
default: false
interface: ezfio,provider,ocaml

[cs_write_wf]
type: logical
doc: If true, the wave function will be written on disk (only to look at it)
default: false
interface: ezfio,provider,ocaml

[pt2_im_weight]
type: double precision
doc: Weight of the imaginary part for the selection, the weight of the real part is (1.0 - pt2_im_weight)
default: 0.5
interface: ezfio,provider,ocaml

[overlap_analysis]
type: logical
doc: If true, print the Hermitian-normalized weight matrix in addition to the standard overlap. Useful for state identification when many states are requested.
default: false
interface: ezfio,provider,ocaml

[cs_debug_state_following]
type: logical
doc: If true, print at each iteration of the complex Davidson the candidates of the state following (score, c-norm, Hermitian overlaps, residual), the choice that alternative selection rules would make, and the drift of the reference vector at each restart. Debug lines start with SF. The results are not changed.
default: false
interface: ezfio,provider,ocaml

[cs_sf_hermitian_overlap]
type: logical
doc: If true, the state following of the complex Davidson normalizes the Ritz vectors with the Hermitian norm (instead of the c-norm) before comparing them to the reference with the Hermitian overlap. The c-normalization divides the score by sqrt(abs(psi^T psi)) and favours spurious Ritz vectors with dispersed phases. Energies are not affected, only the choice of the root.
default: false
interface: ezfio,provider,ocaml

[cs_sf_guard]
type: logical
doc: If true, the state following of the complex Davidson rejects the Ritz vectors whose total energy has Im(E) > cs_sf_im_tol. If no candidate is acceptable, the S2 filter and then the Im(E) filter are relaxed (with a warning) instead of leaving the state without a root.
default: false
interface: ezfio,provider,ocaml

[cs_sf_im_tol]
type: double precision
doc: Tolerance on Im(E) (Hartree) used by cs_sf_guard: a Ritz vector with Im(E) > cs_sf_im_tol is rejected.
default: 1.e-6
interface: ezfio,provider,ocaml

[cs_dav_max_restart]
type: integer
doc: Maximum factor by which diagonalize_ci_cs may multiply N_states_diag when the complex Davidson does not converge (the number of states in the diagonalization is doubled at each restart). 0: no limit. When the limit is reached, the last vectors are kept and a warning is printed.
default: 0
interface: ezfio,provider,ocaml

[cs_warm_start_det]
type: logical
doc: Per-theta CS-CIPSI only (cs_cipsi_per_theta). If true, each theta after the first starts from the converged wave function of the previous theta, truncated DETERMINANT by determinant to 1-cs_warm_start_tol of its weight (the configurations cut by the truncation are completed by make_s2_eigenfunction with zero coefficients), with its complex coefficients as Davidson guess. Exclusive with cs_warm_start_cfg.
default: false
interface: ezfio,provider,ocaml

[cs_warm_start_cfg]
type: logical
doc: Per-theta CS-CIPSI only (cs_cipsi_per_theta). Same as cs_warm_start_det, but the truncation keeps or discards whole CONFIGURATIONS (weight of a configuration = sum of the weights of its determinants), so the truncated space stays spin-complete. Exclusive with cs_warm_start_det.
default: false
interface: ezfio,provider,ocaml

[cs_warm_start_tol]
type: double precision
doc: Weight of the previous theta's complex wave function discarded by the truncation of cs_warm_start_det / cs_warm_start_cfg (smallest weights first), so the selection at the new theta can rebuild that part of the space.
default: 1.e-4
interface: ezfio,provider,ocaml

[cs_warm_start_debug]
type: logical
doc: Per-theta CS-CIPSI only. If true, print at each theta the diagnostics of the starting wave function (lines starting with WS): truncation (determinants, configurations, discarded weight per state), determinants added by the spin completion, Hermitian overlap between the Davidson guess and the first CS eigenvectors, time of the first CS diagonalization, and at convergence the number of CIPSI iterations, the time and the number of discarded determinants selected again. Also active without warm start (reference). The results are not changed.
default: false
interface: ezfio,provider,ocaml

