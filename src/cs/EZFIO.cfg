[do_cs]
type: logical
doc: If true, a CS calculation will be performed
default: false
interface: ezfio,provider,ocaml

[theta_cs]
type: double precision
doc: Initial CS rotation.
default: -1.0
interface: ezfio,provider,ocaml

[theta_step_size]
type: double precision
doc: Step size when screening a range of CS rotation.
default: -1.0
interface: ezfio,provider,ocaml

[n_steps_cs]
type: integer
doc: Number of steps when screening a range of CS rotation.
default: 1
interface: ezfio,provider,ocaml

[cs_cipsi_per_theta]
type: logical
doc: If true, run a COMPLETE CS-CIPSI for each theta value successively (inverted loop) instead of selecting determinants at the base theta and only re-diagonalizing the other theta values on a fixed determinant set.
default: false
interface: ezfio,provider,ocaml

[do_qr_dav]
type: logical
doc: If true, qr orthogonalization of guess vectors will be performed at each iteration in the complex Davidson diagonalization
default: false
interface: ezfio,provider,ocaml

[cs_write_wf]
type: logical
doc: If true, the wave function will be written on disk (only to look at it)
default: false
interface: ezfio,provider,ocaml

[pt2_im_weight]
type: double precision
doc: Weight of the imaginary part for the selection, the weight of the real part is (1.0 - pt2_im_weight)
default: 0.5
interface: ezfio,provider,ocaml

[overlap_analysis]
type: logical
doc: If true, print the Hermitian-normalized weight matrix in addition to the standard overlap. Useful for state identification when many states are requested.
default: false
interface: ezfio,provider,ocaml

[cs_sf_theta_ref]
type: logical
doc: Reference of the state following of the complex Davidson (used when state_following is true). If true, the Ritz vectors are compared to the input vectors of diagonalize_ci_cs, kept unchanged for every Davidson call of this diagonalization, including the retries with more vectors. In a scan of theta these are the vectors converged at the previous theta (or at the previous CIPSI iteration in the per-theta CS-CIPSI). If false, the Ritz vectors are compared to the vectors kept at the last restart of the current call, which change from one cycle to the next: a transient spin contamination can then become the new reference and the root drifts to a spurious state.
default: false
interface: ezfio,provider,ocaml


[cs_warm_start]
type: logical
doc: Per-theta CS-CIPSI only (cs_cipsi_per_theta). If true, each theta after the first starts from the converged complex wave function of the previous theta instead of the bootstrap determinant set. The wave function is truncated to 1-cs_warm_start_tol of its weight by discarding whole configurations (the weight of a configuration is the sum of the weights of its determinants), so the truncated space stays spin-complete, and its complex coefficients are the Davidson guess. The CIPSI then grows the space at the new theta with the usual stopping criteria.
default: false
interface: ezfio,provider,ocaml

[cs_warm_start_tol]
type: double precision
doc: Warm start of the per-theta CS-CIPSI (cs_warm_start). Weight of the complex wave function of the previous theta discarded by the truncation, smallest weights first. The weight of a determinant is its squared modulus divided by the Hermitian norm of the state, averaged over the states. Larger values give a smaller starting space and leave more of it to the selection at the new theta.
default: 1.e-4
interface: ezfio,provider,ocaml
