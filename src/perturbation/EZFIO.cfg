[do_pt2]
type: logical
doc: If `True`, compute the |PT2| contribution
interface: ezfio,provider,ocaml
default: True

[pt2_max]
type: PT2_energy
doc: The selection process stops when the largest |PT2| (for all the state) is lower than `pt2_max` in absolute value
interface: ezfio,provider,ocaml
default: 0.0001

[variance_max]
type: Positive_float
doc: The selection process stops when the largest variance (for all the state) is lower than `variance_max` in absolute value
interface: ezfio,provider,ocaml
default: 0.0

[pt2_min_parallel_tasks]
type: integer
doc: Minimum number of tasks in PT2 calculation
interface: ezfio,provider,ocaml
default: 1

[pt2_diag]
type: logical
doc: Debug (CS-CIPSI). If true, the PT2 accumulates and prints diagnostics of its contributions e_alpha: sum |Re e|, sum |e|, sum |e|**2 (effective number of terms), sums by class (single or double excitation, sign of Re(E - H_alpha,alpha)) and histogram of the phases arg(e_alpha) (lines PT2DIAG). The per-theta CS-CIPSI also prints the stopping test at each iteration (lines STOPTEST) and a record of each theta (lines CSREC). The results are not changed.
interface: ezfio,provider,ocaml
default: False

[pt2_relative_error]
type: Normalized_float
doc: Stop stochastic |PT2| when the relative error is smaller than `pT2_relative_error`
interface: ezfio,provider,ocaml
default: 0.002

[correlation_energy_ratio_max]
type: Normalized_float
doc: The selection process stops at a fixed correlation ratio (useful for getting same accuracy between molecules). Defined as :math:`(E_{CI}-E_{HF})/(E_{CI}+E_{PT2} - E_{HF})`.
interface: ezfio,provider,ocaml
default: 1.00

[h0_type]
type: character*(32)
doc: Type of denominator in PT2. [EN | CFG | HF]
interface: ezfio,provider,ocaml
default: EN
