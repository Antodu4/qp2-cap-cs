[save_wf_after_selection]
type: logical
doc: If true, saves the wave function after the selection, before the diagonalization
interface: ezfio,provider,ocaml
default: False

[seniority_max]
type: integer
doc: Maximum number of allowed open shells. Using -1 selects all determinants
interface: ezfio,ocaml,provider
default: -1

[excitation_ref]
type: integer
doc: 1: Hartree-Fock determinant, 2:All determinants of the dominant configuration
interface: ezfio,ocaml,provider
default: 1

[excitation_max]
type: integer
doc: Maximum number of excitation with respect to the Hartree-Fock determinant. Using -1 selects all determinants
interface: ezfio,ocaml,provider
default: -1

[excitation_alpha_max]
type: integer
doc: Maximum number of excitation for alpha determinants with respect to the Hartree-Fock determinant. Using -1 selects all determinants
interface: ezfio,ocaml,provider
default: -1

[excitation_beta_max]
type: integer
doc: Maximum number of excitation for beta determinants with respect to the Hartree-Fock determinant. Using -1 selects all determinants
interface: ezfio,ocaml,provider
default: -1

[twice_hierarchy_max]
type: integer
doc: Twice the maximum hierarchy parameter (excitation degree plus half the seniority number). Using -1 selects all determinants
interface: ezfio,ocaml,provider
default: -1

[cap_pt2]
type: logical
doc: If true, CAP PT2
interface: ezfio,provider,ocaml
default: False

[cs_pt2]
type: logical
doc: If tru, CS PT2
interface: ezfio,provider,ocaml
default: False

[pt2_max_complex]
type: logical
doc: Stopping test of the CIPSI loops of the complex methods (CAP and CS, both loop orders). If false, the loop stops when the largest |Re(PT2)| over the states is lower than pt2_max, as in the real CIPSI. If true, it stops when the largest modulus of the complex PT2, sqrt(Re(PT2)**2 + Im(PT2)**2), is lower than pt2_max. With a complex Hamiltonian, Re(PT2) can cross zero by chance while Im(PT2) is still large; the modulus avoids stopping on such a space. No effect on the real CIPSI.
interface: ezfio,provider,ocaml
default: False
